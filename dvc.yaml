stages:
  data_ingestion:
    cmd: python -c "from src.components.data_ingestion import DataIngestion; obj=DataIngestion(); obj.initiate_data_ingestion()"
    deps:
      - notebook/data/stud.csv
    outs:
      - artifacts/train.csv
      - artifacts/test.csv
      - artifacts/data.csv
    
  data_transformation:
    cmd: python -c "from src.components.data_ingestion import DataIngestion; from src.components.data_transformation import DataTransformation; obj=DataIngestion(); train_data,test_data=obj.initiate_data_ingestion(); data_trans=DataTransformation(); data_trans.initiate_data_transformation(train_data,test_data)"
    deps:
      - artifacts/train.csv
      - artifacts/test.csv
      - src/components/data_transformation.py
    outs:
      - artifacts/preprocessor.pkl
    
  model_training:
    cmd: python -c "from src.components.data_ingestion import DataIngestion; from src.components.data_transformation import DataTransformation; from src.components.model_trainer import ModelTrainer; obj=DataIngestion(); train_data,test_data=obj.initiate_data_ingestion(); data_trans=DataTransformation(); train_arr,test_arr,_=data_trans.initiate_data_transformation(train_data,test_data); modeltrainer=ModelTrainer(); modeltrainer.initiate_model_trainer(train_arr,test_arr)"
    deps:
      - artifacts/train.csv
      - artifacts/test.csv
      - artifacts/preprocessor.pkl
      - src/components/model_trainer.py
    outs:
      - artifacts/model.pkl
